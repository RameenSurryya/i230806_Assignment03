[versions]
agp = "9.4.1"
coreKtx = "1.10.1"
junit = "4.13.2"
junitVersion = "1.1.5"
espressoCore = "3.5.1"
testCore = "1.5.0"
testRunner = "1.5.2"
appcompat = "1.6.1"
material = "1.10.0"
activityKtx = "1.8.0"
constraintlayout = "2.1.4"
# Assignment 2
recyclerview = "1.4.0"
firebaseBom = "34.19.0"
googleServices = "4.5.0"
camerax = "1.6.2"
agora = "4.6.4"
# Assignment 3
volley = "1.2.1"
glide = "4.16.0"
work = "2.10.0"
securityCrypto = "1.1.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-test-core = { group = "androidx.test", name = "core-ktx", version.ref = "testCore" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "testRunner" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity-ktx = { group = "androidx.activity", name = "activity-ktx", version.ref = "activityKtx" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }
# Lists that come from the database (feed, chats, comments ...)
androidx-recyclerview = { group = "androidx.recyclerview", name = "recyclerview", version.ref = "recyclerview" }
# Firebase: no versions here, they come from firebase-bom
firebase-bom = { group = "com.google.firebase", name = "firebase-bom", version.ref = "firebaseBom" }
firebase-messaging = { group = "com.google.firebase", name = "firebase-messaging" }
# CameraX: live camera preview, photos and short videos for stories (screen 09)
androidx-camera-core = { group = "androidx.camera", name = "camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { group = "androidx.camera", name = "camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { group = "androidx.camera", name = "camera-lifecycle", version.ref = "camerax" }
androidx-camera-video = { group = "androidx.camera", name = "camera-video", version.ref = "camerax" }
androidx-camera-view = { group = "androidx.camera", name = "camera-view", version.ref = "camerax" }
# Agora: real-time voice and video calls
agora-rtc = { group = "io.agora.rtc", name = "full-sdk", version.ref = "agora" }
# Assignment 3: our own PHP web services instead of Firebase Auth / Realtime Database
# Volley: HTTP requests to the PHP endpoints (JSON and file uploads)
volley = { group = "com.android.volley", name = "volley", version.ref = "volley" }
# Glide: loads photos and video thumbnails from the server by URL, with a disk cache
glide = { group = "com.github.bumptech.glide", name = "glide", version.ref = "glide" }
# WorkManager: sends queued offline actions as soon as the internet comes back
androidx-work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
# EncryptedSharedPreferences: keeps the session token encrypted on the phone
androidx-security-crypto = { group = "androidx.security", name = "security-crypto", version.ref = "securityCrypto" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
google-services = { id = "com.google.gms.google-services", version.ref = "googleServices" }